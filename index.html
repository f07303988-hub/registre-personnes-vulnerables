<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Registre — Personnes vulnérables</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registre vulnérables">
<meta name="theme-color" content="#123029">
<!-- Aucune police externe : la pile système suffit et évite toute dépendance réseau pour l'affichage du texte. -->
<!-- Bibliothèques strictement locales (à placer à côté de ce fichier index.html) — aucun repli CDN :
     si un fichier est absent, la carte et l'import Excel se déclarent proprement indisponibles plutôt que
     de contacter un service externe non prévu. Le reste du registre continue de fonctionner normalement.
     Voir les instructions de récupération fournies avec la livraison. -->
<script src="./xlsx.full.min.js" defer></script>
<link rel="stylesheet" href="./leaflet.min.css">
<script src="./leaflet.min.js" defer></script>
<style>
  :root{
    --bg:#F5F6F2; --surface:#FFFFFF; --ink:#16261F; --ink-soft:#4B5750;
    --primary:#1F4E45; --primary-dark:#123029; --primary-tint:#DCE9E4;
    --alert:#C4622D; --alert-tint:#F6E4D7; --danger:#A23B32; --danger-tint:#F3DEDB;
    --ok:#3E7A5D; --ok-tint:#DCEBE3; --warn:#B8862F; --warn-tint:#F3E6C9;
    --border:#DAD9D0; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; padding-bottom:84px;}
  h1,h2,h3{font-weight:700; letter-spacing:-0.01em; margin:0 0 4px 0;}
  h1{font-size:1.3rem;} h2{font-size:1.05rem; color:var(--primary-dark);}
  h3{font-size:0.95rem; font-weight:600; color:var(--ink-soft); margin-bottom:10px;}
  p{margin:0 0 10px 0;} a{color:var(--primary);} button{font-family:inherit;}

  header.appbar{background:var(--primary-dark); color:#fff; padding:16px 18px 14px; position:sticky; top:0; z-index:20;}
  header.appbar .header-text{padding-right:150px;}
  header.appbar .eyebrow{font-size:0.72rem; color:#9FBDB2; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px;}
  header.appbar h1{color:#fff; font-size:1.15rem; line-height:1.25;}
  header.appbar .whoami{font-size:0.76rem; color:#B9D2C8; margin-top:2px;}
  header.appbar .headerbtns{position:absolute; right:14px; top:18px; display:flex; gap:6px;}
  header.appbar .lockbtn, header.appbar .helpbtn{background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25); color:#fff; border-radius:8px; padding:6px 10px; font-size:0.78rem; cursor:pointer;}
  main.wrap{max-width:640px; margin:0 auto; padding:18px 16px 20px; position:relative;}

  .lockscreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .lockcard{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 24px;
    max-width:380px; width:100%; box-shadow:0 1px 3px rgba(22,38,31,0.06);}
  .lockcard .badge{width:44px;height:44px;border-radius:12px; background:var(--primary-tint); color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center; font-size:1.3rem; margin-bottom:14px;}
  .lockcard p.sub{color:var(--ink-soft); font-size:0.92rem;}
  .field-input{width:100%; font-size:1rem; padding:11px 12px; margin:10px 0 0; border:1.5px solid var(--border);
    border-radius:10px; background:#fff;}
  .pin-input{width:100%; font-size:1.3rem; letter-spacing:0.2em; text-align:center; padding:12px 10px; margin:10px 0 0;
    border:1.5px solid var(--border); border-radius:10px; background:#fff;}
  .field-input:focus, .pin-input:focus{outline:none; border-color:var(--primary);}
  .err-msg{color:var(--danger); font-size:0.85rem; min-height:1.2em; margin:8px 0 2px;}
  .switch-link{display:block; text-align:center; font-size:0.85rem; margin-top:14px; color:var(--primary);
    text-decoration:underline; background:none; border:none; cursor:pointer; width:100%;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 16px; border-radius:10px;
    border:1px solid transparent; font-size:0.94rem; font-weight:600; cursor:pointer; width:100%; margin-top:14px;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-ghost{background:transparent; color:var(--primary); border-color:var(--border);}
  .btn-danger{background:var(--danger-tint); color:var(--danger); border-color:transparent;}
  .btn-sm{width:auto; padding:8px 12px; font-size:0.85rem; margin-top:0;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
    display:flex; z-index:20;}
  nav.tabs button{flex:1; background:none; border:none; padding:9px 2px 8px; font-size:0.6rem; color:var(--ink-soft);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button .ic{font-size:1rem;}
  nav.tabs button.active{color:var(--primary-dark); font-weight:700;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  fieldset{border:none; padding:0; margin:0 0 20px 0;}
  legend{padding:0;}
  label{display:block; font-size:0.86rem; font-weight:600; color:var(--ink-soft); margin:12px 0 4px;}
  fieldset > label:first-child, .card > label:first-child{margin-top:0;} /* seulement le tout premier libellé d'une section, pas chaque libellé de cellule dans une grille */
  input[type=text], input[type=tel], input[type=email], input[type=date], input[type=password],
  input[type=number], input[type=file], select, textarea{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:8px; font-size:0.95rem;
    background:#fff; color:var(--ink); font-family:inherit;}
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary);}
  .radio-row, .check-row{display:flex; align-items:flex-start; gap:9px; margin:9px 0; font-size:0.92rem;}
  .radio-row input, .check-row input{margin-top:3px; flex-shrink:0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .hint{font-size:0.8rem; color:var(--ink-soft); margin-top:2px;}
  .divider{border:none; border-top:1px solid var(--border); margin:18px 0;}
  .optional-toggle{background:var(--primary-tint); color:var(--primary-dark); border:none; border-radius:8px;
    padding:9px 12px; font-size:0.86rem; font-weight:600; width:100%; text-align:left; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;}
  .optional-body{padding-top:10px;}
  .legal-link{display:block; text-align:center; font-size:0.82rem; margin-top:14px; color:var(--primary);
    text-decoration:underline; background:none; border:none; cursor:pointer; width:100%;}

  .searchbar{width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; margin-bottom:12px;
    font-size:0.95rem; background:#fff;}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .filter-chip{border:1px solid var(--border); background:#fff; color:var(--ink-soft); border-radius:100px;
    padding:6px 11px; font-size:0.78rem; cursor:pointer;}
  .filter-chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .entry-card{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary);
    border-radius:8px; padding:12px 14px; margin-bottom:9px; cursor:pointer;}
  .entry-card .name{font-weight:700; font-size:1rem; display:flex; align-items:center; gap:6px;}
  .entry-card .meta{font-size:0.82rem; color:var(--ink-soft); margin-top:2px;}
  .pill{display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:100px;
    background:var(--primary-tint); color:var(--primary-dark); margin-right:5px; margin-top:6px;}
  .pill.seul{background:var(--alert-tint); color:var(--alert);}
  .pill.statut-demande{background:var(--warn-tint); color:#8A5E14;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.danger{background:var(--danger);}
  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .ic{font-size:2rem; margin-bottom:8px;}

  .alert-banner{background:var(--alert-tint); border:1px solid #E7C2A6; color:#7A3E1A; border-radius:10px;
    padding:11px 13px; margin-bottom:14px; font-size:0.88rem;}
  .warn-banner{background:var(--warn-tint); border:1px solid #E0C177; color:#7A5A0E; border-radius:10px;
    padding:11px 13px; margin-bottom:14px; font-size:0.85rem;}
  .synth-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .synth-chip{flex:1; min-width:70px; background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; text-align:center;}
  .synth-chip b{display:block; font-size:1.1rem;}
  .synth-chip span{font-size:0.68rem; color:var(--ink-soft);}
  .alert-entry{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    margin-bottom:9px; border-left:4px solid var(--border);}
  .alert-entry.statut-contacte{border-left-color:var(--ok);}
  .alert-entry.statut-absent{border-left-color:var(--alert);}
  .alert-entry.statut-visite{border-left-color:var(--danger);}
  .alert-entry .row1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .telbtn{background:var(--primary-tint); color:var(--primary-dark); border:none; border-radius:8px; padding:8px 12px;
    font-size:0.85rem; font-weight:700; text-decoration:none; display:inline-block;}
  .statut-select, .mode-select{width:100%; margin-top:8px; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px;
    font-size:0.88rem; background:#fff;}
  .detail-toggle{background:none; border:none; color:var(--primary); font-size:0.78rem; text-decoration:underline;
    padding:6px 0; cursor:pointer;}

  .sheet-overlay{position:fixed; inset:0; background:rgba(22,38,31,0.45); z-index:40; display:flex; align-items:flex-end;}
  .sheet{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px 18px 26px;}
  .sheet .close{background:var(--bg); border:none; border-radius:50%; width:30px; height:30px; float:right; font-size:1rem; cursor:pointer;}
  .field-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--bg); font-size:0.9rem; gap:10px;}
  .field-row .k{color:var(--ink-soft); flex-shrink:0;} .field-row .v{font-weight:600; text-align:right;}

  .user-row{padding:10px 0; border-bottom:1px solid var(--bg);}
  .user-row .urow-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .user-row .uname{font-weight:600; font-size:0.92rem;}
  .user-row .urole{font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
  .user-row .umeta{font-size:0.78rem; color:var(--ink-soft); margin-top:3px;}
  .user-row .uactions{display:flex; gap:6px; flex-shrink:0;}
  .log-row{font-size:0.82rem; padding:7px 0; border-bottom:1px solid var(--bg); display:flex; justify-content:space-between; gap:8px;}
  .log-row .ev-login{color:var(--ok);} .log-row .ev-logout{color:var(--ink-soft);} .log-row .ev-other{color:var(--primary-dark);}

  .report-box{background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; font-size:0.86rem;
    white-space:pre-wrap; font-family:ui-monospace, monospace; max-height:340px; overflow-y:auto; margin-bottom:12px;}
  .restricted{background:var(--bg); border:1px dashed var(--border); border-radius:10px; padding:16px; text-align:center; color:var(--ink-soft); font-size:0.88rem;}
  .dash-tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
  .dash-tile h3{margin-bottom:10px;}
  .dash-big{font-size:1.6rem; font-weight:800; color:var(--primary-dark);}
  .badge-inactif{background:var(--danger-tint); color:var(--danger); font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:100px;}

  #toast{position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--primary-dark); color:#fff;
    padding:10px 18px; border-radius:100px; font-size:0.86rem; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s;
    max-width:88vw; text-align:center;}
  #toast.show{opacity:1;}

  /* ---- Module Tournées ---- */
  .map-wrap{background:#EFF2EC; border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:14px; position:relative;}
  .map-wrap svg{width:100%; height:auto; display:block;}
  .leaflet-container-box{width:100%; height:280px; border-radius:8px; overflow:hidden;}
  .map-legend{display:flex; gap:14px; font-size:0.76rem; color:var(--ink-soft); margin-top:8px;}
  .map-legend span{display:inline-flex; align-items:center; gap:5px;}
  .map-legend .dotc{width:12px; height:12px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px var(--border);}
  .map-marker{fill:var(--primary); stroke:#fff; stroke-width:2; cursor:pointer;}
  .map-marker.urgente{fill:var(--danger);}
  .map-marker-label{font-size:9px; fill:#fff; font-weight:700; text-anchor:middle; pointer-events:none;}
  .map-unavailable{text-align:center; color:var(--ink-soft); font-size:0.85rem; padding:20px;}
  .select-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--bg);}
  .select-row input[type=checkbox]{width:20px; height:20px; flex-shrink:0;}
  .select-row .srmeta{flex:1; font-size:0.88rem;}
  .select-row .srname{font-weight:600;}
  .prio-tag{font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:100px; margin-left:6px;}
  .prio-urgente{background:var(--danger-tint); color:var(--danger);}
  .prio-normale{background:var(--primary-tint); color:var(--primary-dark);}
  .prio-preventif{background:var(--ok-tint); color:var(--ok);}
  .stepper{display:flex; align-items:center; gap:14px; justify-content:center; margin:10px 0;}
  .stepper button{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:#fff;
    font-size:1.3rem; font-weight:700; color:var(--primary-dark); cursor:pointer;}
  .stepper .stepper-val{font-size:1.5rem; font-weight:800; min-width:36px; text-align:center;}
  .agent-tournee-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
  .agent-tournee-card h3{color:var(--primary-dark); font-size:1rem;}
  .visite-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--bg); font-size:0.86rem;}
  .visite-row .vorder{width:22px; height:22px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark);
    font-size:0.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .visite-row .vname{flex:1;}
  .visite-row select{width:auto; padding:5px 6px; font-size:0.78rem;}
  .visite-row .vbtn{background:none; border:none; color:var(--ink-soft); font-size:0.9rem; cursor:pointer; padding:2px 4px;}
  .progress-bar{background:var(--bg); border-radius:100px; height:10px; overflow:hidden; margin:10px 0 16px;}
  .progress-bar > div{background:var(--ok); height:100%;}
  .big-action-row{display:flex; gap:10px; margin-top:16px;}
  .big-action-row .btn{margin-top:0; padding:16px 10px; font-size:1rem;}
  .resultat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0;}
  .resultat-choice{border:1.5px solid var(--border); border-radius:10px; padding:12px 8px; text-align:center;
    background:#fff; cursor:pointer; font-size:0.82rem; font-weight:600;}
  .resultat-choice.selected{border-color:var(--primary); background:var(--primary-tint);}

  .leaflet-attribution-flag{display:none !important;} /* icône décorative de Leaflet — la mention "© OpenStreetMap" reste affichée */
  .pwd-row{display:flex; align-items:stretch; gap:8px; margin:10px 0 0;}
  .pwd-row:first-child{margin-top:0;}
  .pwd-row input{margin:0; flex:1; min-width:0;}
  .pwd-row .pwd-toggle{background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:0 13px;
    font-size:1.05rem; cursor:pointer; flex-shrink:0;}

  @media print{
    header.appbar, nav.tabs, .no-print{display:none !important;}
    body{padding:0; background:#fff;}
    .sheet-overlay{position:static; background:none;}
    .sheet{max-height:none; border-radius:0; box-shadow:none;}
    /* Quand une fenêtre (AR, notice RGPD…) est ouverte au moment de l'impression, seule cette fenêtre doit
       s'imprimer — jamais la page du dessous (ex. la fiche ou le formulaire en cours). */
    body:has(.sheet-overlay) main.wrap{display:none !important;}
  }
</style>
</head>
<body>

<div id="lockLayer"></div>

<div id="appLayer" style="display:none;">
  <header class="appbar">
    <div class="header-text">
      <div class="eyebrow" id="communeEyebrow">Commune</div>
      <h1>Registre des personnes vulnérables</h1>
      <div class="whoami" id="whoamiLine"></div>
    </div>
    <div class="headerbtns">
      <button class="helpbtn" onclick="showHelpModal()">❓ Aide</button>
      <button class="lockbtn" onclick="lockApp('manuel')">🔒 Verrouiller</button>
    </div>
  </header>
  <main class="wrap" id="mainContent"></main>
  <nav class="tabs">
    <button data-tab="accueil" onclick="switchTab('accueil')"><span class="ic">🏠</span>Accueil</button>
    <button data-tab="form" onclick="switchTab('form')"><span class="ic">📝</span>Inscription</button>
    <button data-tab="registre" onclick="switchTab('registre')"><span class="ic">📋</span>Registre</button>
    <button data-tab="alerte" onclick="switchTab('alerte')"><span class="ic">☎️</span>Alerte</button>
    <button data-tab="tournees" onclick="switchTab('tournees')"><span class="ic">🗺️</span>Tournées</button>
    <button data-tab="reglages" onclick="switchTab('reglages')"><span class="ic">⚙️</span>Réglages</button>
  </nav>
</div>

<div id="toast"></div>

<script>
/* ===================== UTIL ===================== */
function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2800);
}
function nowISO(){ return new Date().toISOString(); }
function toLocalISODate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return toLocalISODate(new Date()); }
function fmtDT(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function addYearsISO(dateStr, years){
  const d = new Date(dateStr+'T00:00:00'); d.setFullYear(d.getFullYear()+years); return toLocalISODate(d);
}
function daysBetween(a, b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function isValidPhone(v){ return !v || /^[0-9+()\s.\-]{6,20}$/.test(v); }
function togglePwd(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁️' : '🙈';
  btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
}
function passwordStrength(p){
  if(!p) return {score:0, label:'', color:'var(--border)'};
  let score = 0;
  if(p.length>=12) score++;
  if(p.length>=16) score++;
  if(/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
  if(/[0-9]/.test(p)) score++;
  if(/[^a-zA-Z0-9]/.test(p)) score++;
  if(p.length<12) return {score:0, label:'Trop court (12 caractères minimum)', color:'var(--danger)'};
  if(score<=2) return {score:1, label:'Robustesse faible — essayez une phrase de passe plus longue', color:'var(--danger)'};
  if(score<=3) return {score:2, label:'Robustesse correcte', color:'var(--warn)'};
  return {score:3, label:'Robustesse solide', color:'var(--ok)'};
}
function renderPwdStrength(elId, value){
  const el = document.getElementById(elId);
  if(!el) return;
  const s = passwordStrength(value);
  el.innerHTML = value ? `<div style="height:5px;border-radius:100px;background:var(--border);overflow:hidden;margin-top:6px;">
    <div style="height:100%;width:${s.score*33+(s.score?1:0)}%;background:${s.color};transition:width .15s;"></div>
    </div><p class="hint" style="color:${s.color};margin-top:4px;">${esc(s.label)}</p>` : '';
}

/* ===================== CRYPTO HELPERS ===================== */
/* ===================== VERSION & MIGRATION ===================== */
const APP_VERSION = '3.7.1';
const APP_VERSION_DATE = '2026-09-12';
/**
 * Migration de structure des données entre versions. Appelée juste après le déchiffrement
 * réussi d'un registre, avant toute autre opération. Ne doit jamais supprimer silencieusement
 * une donnée : chaque migration ajoute des valeurs par défaut aux champs manquants, jamais
 * l'inverse. Une sauvegarde automatique est proposée avant toute migration structurelle.
 */
function compareVersions(a, b){
  const pa = a.split('.').map(n=>parseInt(n,10)||0), pb = b.split('.').map(n=>parseInt(n,10)||0);
  for(let i=0; i<Math.max(pa.length,pb.length); i++){
    const d = (pa[i]||0) - (pb[i]||0);
    if(d!==0) return d<0 ? -1 : 1;
  }
  return 0;
}
/**
 * Chaîne de migrations réelles, appliquées dans l'ordre selon la version d'où l'on part. Chaque entrée
 * transforme les données pour corriger un état hérité d'une version antérieure — jamais de suppression
 * silencieuse, uniquement des compléments ou corrections de champs. Ajouter une nouvelle migration ici
 * à chaque changement de structure (ex. 3.1.x → 4.0.0), sans jamais modifier les entrées déjà appliquées.
 */
const MIGRATIONS = [
  { to: '3.0.1', migrate(state){
    // Avant le correctif 3.0.1, une fiche marquée « inscrite » via l'accusé de réception ne recevait pas
    // systématiquement de prochaine échéance de vérification quinquennale, ce qui la faisait apparaître à tort
    // comme « en retard » dès son inscription. On complète ici les fiches inscrites concernées, jamais celles
    // déjà correctement renseignées.
    let count = 0;
    state.entries = (state.entries||[]).map(e=>{
      if(e.statut==='inscrit' && !e.prochaineVerification){
        count++;
        return {...e, prochaineVerification: addYearsISO(e.dateInscription || e.dateReception || todayStr(), 5)};
      }
      return e;
    });
    if(count>0) state.__migrationNotes = [...(state.__migrationNotes||[]), `${count} fiche(s) : échéance de vérification recalculée (3.0.1)`];
    return state;
  }},
];
/**
 * Migration de structure des données entre versions. Appelée juste après le déchiffrement
 * réussi d'un registre, avant toute autre opération. Ne doit jamais supprimer silencieusement
 * une donnée : chaque migration ajoute ou corrige des champs, jamais l'inverse.
 */
function migrateStateIfNeeded(state, explicitFromVersion){
  // arguments.length distingue "pas de 2e argument fourni" (repli sur state.appVersion, déjà fusionné)
  // de "explicitement undefined" (sauvegarde d'avant le marquage de version) — un simple `||` confondrait les deux.
  const fromVersion = (arguments.length >= 2 ? explicitFromVersion : state.appVersion) || '2.3.1';
  if(fromVersion === APP_VERSION) return state;
  const applied = [];
  MIGRATIONS.forEach(m => {
    if(compareVersions(fromVersion, m.to) < 0){
      state = m.migrate(state);
      applied.push(m.to);
    }
  });
  const notes = state.__migrationNotes || [];
  delete state.__migrationNotes;
  addLog('migration_donnees', {depuis: fromVersion, vers: APP_VERSION, etapes: applied, notes});
  state.appVersion = APP_VERSION;
  return state;
}

const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf){
  // Traitement par blocs de 8192 octets : éviter d'étaler un tableau entier en arguments de fonction,
  // qui plante au-delà d'une certaine taille (dépassement de la pile d'appels JavaScript). Sans limite
  // de taille avec cette méthode — testé jusqu'à plusieurs centaines de fiches + un an de journal.
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunkSize = 8192;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
function unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }

async function deriveKEK(password, saltB64){
  const salt = unb64(saltB64);
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function aesEncryptBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes);
  return b64(iv) + '.' + b64(cipher);
}
async function aesDecryptBytes(key, blob){
  const [ivB64, cB64] = blob.split('.');
  const iv = unb64(ivB64);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, unb64(cB64));
  return new Uint8Array(plain);
}
async function encryptJSON(key, obj){ return aesEncryptBytes(key, enc.encode(JSON.stringify(obj))); }
async function decryptJSON(key, blob){ return JSON.parse(dec.decode(await aesDecryptBytes(key, blob))); }

/* ===================== STORAGE KEYS ===================== */
const LS_USERS = 'pv_users';       // plaintext array [{id, username, nomComplet, fonction, salt, wrappedDEK, role, actif, ...}]
const LS_DATA  = 'pv_data';        // AES-GCM(DEK) of appState
const LS_ATTEMPTS = 'pv_attempts'; // plaintext { username: {count, lockUntil} } — no personal data
const LS_SECLOG = 'pv_seclog';     // plaintext [{event, username, at}] — journal de sécurité minimal, hors chiffrement
                                    // (nécessaire : un échec de connexion survient précisément quand la clé
                                    // de déchiffrement du journal principal n'est pas disponible)
function getSecLog(){ return JSON.parse(localStorage.getItem(LS_SECLOG) || '[]'); }
function addSecLog(event, username){
  const log = getSecLog();
  log.unshift({ event, username, at: nowISO() });
  const cutoff = Date.now() - 365*86400000;
  const pruned = log.filter(l => new Date(l.at).getTime() >= cutoff);
  localStorage.setItem(LS_SECLOG, JSON.stringify(pruned));
}

function getUsers(){ return JSON.parse(localStorage.getItem(LS_USERS) || '[]'); }

function getAttempts(){ return JSON.parse(localStorage.getItem(LS_ATTEMPTS) || '{}'); }
function saveAttempts(a){ localStorage.setItem(LS_ATTEMPTS, JSON.stringify(a)); }
function isAdmin(){ return currentRole === 'admin'; }
function isAuthorizedForTournee(t){
  // Contrôle réel, pas seulement une interface masquée : un utilisateur non authentifié,
  // ou authentifié mais ni administrateur ni agent affecté à cette tournée, est refusé
  // même en appelant la fonction directement (ex. depuis la console du navigateur).
  if(!dekKey || !currentUser || !t) return false;
  if(isAdmin()) return true;
  return t.sousTournees.some(s => s.agent === currentUser);
}
function entryName(id){
  const e = appState.entries.find(x=>x.id===id);
  return e ? `${e.prenom} ${e.nom}` : '(fiche non retrouvée)';
}

async function persist(){
  if(!dekKey) return;
  purgeOldLogs();
  const blob = await encryptJSON(dekKey, appState);
  localStorage.setItem(LS_DATA, blob);
}
function addLog(event, extra){
  appState.logs.unshift({ event, user: currentUser, at: nowISO(), ...(extra||{}) });
}
function purgeOldLogs(){
  const cutoff = Date.now() - 365*86400000;
  appState.logs = appState.logs.filter(l => new Date(l.at).getTime() >= cutoff);
}

async function createFirstAccount(){
  const username = document.getElementById('newUsername').value.trim();
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  const err = document.getElementById('lockErr');
  if(!username){ err.textContent = "Merci d'indiquer un nom d'agent."; return; }
  if(p1.length < 12){ err.textContent = 'Le mot de passe doit contenir au moins 12 caractères.'; return; }
  if(p1 !== p2){ err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }

  const rawDEK = crypto.getRandomValues(new Uint8Array(32));
  dekKey = await crypto.subtle.importKey('raw', rawDEK, {name:'AES-GCM'}, true, ['encrypt','decrypt']);

  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const kek = await deriveKEK(p1, salt);
  const wrappedDEK = await aesEncryptBytes(kek, rawDEK);

  saveUsers([{ id: crypto.randomUUID(), username, nomComplet: username, fonction:'', salt, wrappedDEK,
    role:'admin', actif:true, dateHabilitation: todayStr(), habilitePar:'(création initiale)', dateDebut: todayStr(), dateFin:null }]);
  currentUser = username; currentRole = 'admin';
  appState = defaultState();
  addLog('login', {note:'Création du compte'});
  await persist();
  enterApp();
  setTimeout(showHelpModal, 400);
}

async function tryLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('lockErr');
  const btn = document.getElementById('loginBtn');
  const genericErr = 'Identifiant ou mot de passe incorrect.';

  const attempts = getAttempts();
  const a = attempts[username] || {count:0, lockUntil:0};
  if(a.lockUntil && Date.now() < a.lockUntil){
    const secs = Math.ceil((a.lockUntil - Date.now())/1000);
    err.textContent = `Trop de tentatives. Réessayez dans ${secs} s.`;
    addSecLog('echec_connexion_verrouille', username);
    return;
  }

  const user = getUsers().find(u=>u.username===username);
  if(user && user.bloque){ err.textContent = 'Ce compte a été bloqué après plusieurs échecs. Seul un administrateur peut le débloquer.'; addSecLog('echec_connexion_bloque', username); return; }
  if(user && user.actif===false){ err.textContent = user.revoque ? "L'habilitation de ce compte a été révoquée." : 'Ce compte a été désactivé.'; addSecLog('echec_connexion_inactif', username); return; }
  btn.disabled = true;
  try{
    if(!user) throw new Error('unknown');
    const kek = await deriveKEK(password, user.salt);
    const rawDEK = await aesDecryptBytes(kek, user.wrappedDEK);
    const key = await crypto.subtle.importKey('raw', rawDEK, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
    const blob = localStorage.getItem(LS_DATA);
    const state = await decryptJSON(key, blob);
    dekKey = key; currentUser = username; currentRole = user.role || 'agent';
    const rawVersion = state.appVersion; // capturé AVANT la fusion avec defaultState(), qui remplit sinon
                                          // silencieusement ce champ avec la version courante
    appState = { ...defaultState(), ...state };
    appState.config = { ...defaultConfig(), ...(appState.config||{}) };
    appState = migrateStateIfNeeded(appState, rawVersion);
    delete attempts[username]; saveAttempts(attempts);
    addLog('login');
    await persist();
    enterApp();
  }catch(e){
    addSecLog('echec_connexion', username);
    a.count = (a.count||0) + 1;
    if(a.count >= 10 && user){
      const users = getUsers();
      const u2 = users.find(x=>x.id===user.id);
      if(u2){ u2.bloque = true; saveUsers(users); }
      delete attempts[username]; saveAttempts(attempts);
      err.textContent = "Trop d'échecs successifs : ce compte vient d'être bloqué. Seul un administrateur peut le débloquer.";
    } else {
      if(a.count >= 5){ a.lockUntil = Date.now() + Math.min(30000 * Math.pow(2, a.count-5), 600000); }
      attempts[username] = a; saveAttempts(attempts);
      err.textContent = a.lockUntil && Date.now() < a.lockUntil
        ? `${genericErr} Compte temporairement bloqué (${Math.ceil((a.lockUntil-Date.now())/1000)} s).`
        : genericErr;
    }
  }finally{
    btn.disabled = false;
  }
}

async function lockApp(reason){

  document.querySelectorAll('.sheet-overlay').forEach(o=>o.remove()); // ferme immédiatement toute fiche/rapport resté ouvert
  if(dekKey){

/* ---- Verrouillage automatique ---- */
function startInactivityWatch(){
  stopInactivityWatch();
  const evs = ['click','keydown','touchstart','mousemove','scroll'];
  window.__inactivityHandler = () => resetInactivityTimer();
  evs.forEach(ev => document.addEventListener(ev, window.__inactivityHandler, {passive:true}));
  resetInactivityTimer();
}
function stopInactivityWatch(){
  if(inactivityTimer) clearTimeout(inactivityTimer);
  if(window.__inactivityHandler){
    ['click','keydown','touchstart','mousemove','scroll'].forEach(ev => document.removeEventListener(ev, window.__inactivityHandler));
  }
}
function resetInactivityTimer(){
  if(!dekKey) return;
  if(inactivityTimer) clearTimeout(inactivityTimer);
  const minutes = (appState.config && appState.config.verrouillageMinutes) || 5;
  inactivityTimer = setTimeout(()=>{ lockApp('auto'); toast('Session verrouillée pour inactivité.'); }, minutes*60*1000);
}

  return appState.entries.filter(e => e.statut==='radiee' && e.radiation && daysBetween(e.radiation.date, todayStr()) >= days);
}

  document.getElementById('mainContent').innerHTML = html;

function radio(name, value, current, label){
  const id = name+'_'+value;
  return `<div class="radio-row"><input type="radio" name="${name}" id="${id}" value="${value}" ${current===value?'checked':''}><label for="${id}" style="margin:0; font-weight:400;">${esc(label)}</label></div>`;
}
function toggleOpt(id){ const el = document.getElementById(id); el.style.display = el.style.display==='none' ? 'block' : 'none'; }
function getRadio(name){ const el = document.querySelector(`input[name=${name}]:checked`); return el ? el.value : null; }

function findPossibleDuplicate(nom, prenom, naissance, adresse, excludeId){
  const norm = s => (s||'').toLowerCase().trim();
  return appState.entries.find(e => e.id!==excludeId && e.statut!=='radiee' &&
    norm(e.nom)===norm(nom) && norm(e.prenom)===norm(prenom) &&
    (e.naissance===naissance || norm(e.adresse)===norm(adresse)));
}

async function submitForm(){
  const err = document.getElementById('formErr');
  const nom = document.getElementById('f_nom').value.trim();
  const prenom = document.getElementById('f_prenom').value.trim();
  const qualite = getRadio('f_qualite');
  const demandeur = getRadio('f_demandeur');
  const tel = document.getElementById('f_tel').value.trim();
  const email = document.getElementById('f_email').value.trim();
  const urgTel = document.getElementById('f_urgTel').value.trim();
  const absDebut = document.getElementById('f_absDebut').value;
  const absFin = document.getElementById('f_absFin').value;
  const naissance = document.getElementById('f_naissance').value;
  const adresse = document.getElementById('f_adresse').value.trim();

  if(!nom || !prenom){ err.textContent = 'Le nom et le prénom sont obligatoires.'; return; }
  if(!qualite){ err.textContent = "Merci d'indiquer la qualité d'inscription."; return; }
  if(!demandeur){ err.textContent = "Merci d'indiquer qui effectue la demande."; return; }
  if(demandeur==='tiers' && !document.getElementById('f_tiersEcrit').checked){
    err.textContent = "Pour une demande faite par un tiers, la case de certification écrite doit être cochée."; return;
  }
  if(!isValidPhone(tel)){ err.textContent = 'Le numéro de téléphone semble invalide.'; return; }
  if(!isValidPhone(urgTel)){ err.textContent = "Le numéro de téléphone d'urgence semble invalide."; return; }
  if(!isValidEmail(email)){ err.textContent = "L'adresse email semble invalide."; return; }
  if(naissance && new Date(naissance) > new Date()){ err.textContent = 'La date de naissance ne peut pas être dans le futur.'; return; }
  if(absDebut && absFin && absFin < absDebut){ err.textContent = "La date de fin d'absence doit être postérieure à la date de début."; return; }

  const wasEditing = !!editingId;
  if(!wasEditing){
    const dup = findPossibleDuplicate(nom, prenom, naissance, adresse, editingId);
    if(dup){
      const cont = confirm(`Une personne présentant des informations similaires existe déjà dans le registre (${dup.prenom} ${dup.nom}). Vérifier avant de poursuivre.\n\nContinuer malgré tout ?`);
      if(!cont) return;
    }
  }

  const prev = wasEditing ? appState.entries.find(e=>e.id===editingId) : null;
  const data = {
    id: editingId || crypto.randomUUID(), nom, prenom, naissance,
    sexe: document.getElementById('f_sexe').value,
    adresse, tel, email,
    qualite, priorite: document.getElementById('f_priorite').value, seul: getRadio('f_seul'),
    logement: document.getElementById('f_logement').value,
    clim: document.getElementById('f_clim').value,
    prestation: document.getElementById('f_prestation').value,
    absDebut, absFin,
    urgNom: document.getElementById('f_urgNom').value.trim(), urgTel,
    urgLien: document.getElementById('f_urgLien').value.trim(),
    besoinsSpecifiques: document.getElementById('f_besoins').value.trim(),
    observations: document.getElementById('f_observations').value.trim(),
    tuteurNom: document.getElementById('f_tuteurNom').value.trim(),
    tuteurQualite: document.getElementById('f_tuteurQualite').value.trim(),
    tuteurAdresse: document.getElementById('f_tuteurAdresse').value.trim(),
    tuteurTel: document.getElementById('f_tuteurTel').value.trim(),
    tuteurEmail: document.getElementById('f_tuteurEmail').value.trim(),
    dateReception: document.getElementById('f_dateReception').value || todayStr(),
    modeReception: document.getElementById('f_modeReception').value,
    demandeur,
    tiersNom: document.getElementById('f_tiersNom')?.value.trim() || '',
    tiersQualite: document.getElementById('f_tiersQualite')?.value.trim() || '',
    tiersTel: document.getElementById('f_tiersTel')?.value.trim() || '',
    tiersEmail: document.getElementById('f_tiersEmail')?.value.trim() || '',
    tiersEcrit: document.getElementById('f_tiersEcrit')?.checked || false,
    dateMaj: todayStr(),
    statut: wasEditing ? prev.statut : 'demande_recue',
    ar: wasEditing ? prev.ar : { etabli:false, dateEtabli:null, dateEnvoi:null, agentEnvoi:null, modeEnvoi:null },
    dateInscription: wasEditing ? prev.dateInscription : null,
    radiation: wasEditing ? prev.radiation : null,
    derniereVerification: wasEditing ? prev.derniereVerification : null,
    prochaineVerification: wasEditing ? prev.prochaineVerification : null,
    location: window.__formLocTap || (wasEditing ? (prev.location||null) : null),
  };
  if(wasEditing){ appState.entries = appState.entries.map(e => e.id===editingId ? data : e); }
  else{ appState.entries.push(data); }
  addLog(wasEditing ? 'fiche_modifiee' : 'fiche_creee', {ficheId: data.id});
  await persist();
  editingId = null;
  toast(wasEditing ? 'Fiche mise à jour.' : `Demande enregistrée pour ${prenom} ${nom}.`);
  switchTab('registre');
  if(!wasEditing){
    setTimeout(()=>toast("Pensez à établir l'accusé de réception depuis la fiche."), 2800);
  }
}

/* ===================== VÉRIFICATION QUINQUENNALE ===================== */
function verifStatus(e){
  if(!e.prochaineVerification) return {level:'danger', label:'Vérification à effectuer', icon:'🔴', jours:null};
  const jours = daysBetween(todayStr(), e.prochaineVerification);
  if(jours < 0) return {level:'danger', label:'Échéance dépassée', icon:'🔴', jours};
  if(jours <= 90) return {level:'warn', label:'À vérifier bientôt', icon:'🟠', jours};
  return {level:'ok', label:'À jour', icon:'🟢', jours};
}
function askVerification(id){
  const e = appState.entries.find(x=>x.id===id);
  if(!e) return;
  document.querySelector('.sheet-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="sheet">
      <button class="close" onclick="this.closest('.sheet-overlay').remove()">✕</button>
      <h2>Vérification quinquennale</h2>
      <p class="hint">${esc(e.prenom)} ${esc(e.nom)} — la personne a-t-elle confirmé qu'elle ne s'oppose pas au
      maintien de son inscription au registre ?</p>
      <button class="btn btn-primary" onclick="this.closest('.sheet-overlay').remove(); confirmVerificationOui('${id}')">✓ Oui — maintenir l'inscription</button>
      <button class="btn btn-danger" onclick="this.closest('.sheet-overlay').remove(); confirmVerificationNon('${id}')">✕ Non — opposition au maintien</button>
      <button class="btn btn-ghost" onclick="this.closest('.sheet-overlay').remove()">Annuler</button>
    </div>`;
  document.body.appendChild(overlay);
}
async function confirmVerificationOui(id){
  appState.entries = appState.entries.map(e => e.id===id ? {...e, derniereVerification: todayStr(), prochaineVerification: addYearsISO(todayStr(),5)} : e);
  addLog('verification', {ficheId:id, resultat:'confirmee'});
  await persist();
  document.querySelector('.sheet-overlay')?.remove();
  toast('Absence d’opposition confirmée — prochaine échéance dans 5 ans.');
  renderRegistre();
}
function confirmVerificationNon(id){
  addLog('verification', {ficheId:id, resultat:'opposition'});
  persist();
  document.querySelector('.sheet-overlay')?.remove();
  openRadiationModal(id);
}

/* ===================== REGISTRE ===================== */
function age(naissance){
  if(!naissance) return '';
  const d = new Date(naissance), now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m===0 && now.getDate() < d.getDate())) a--;
  return a;
}
function qualiteLabel(q){ return {'65plus':'65 ans et +', '60inapte':'60+ inapte', 'handicap':'Handicap', 'a_verifier':'⚠️ Qualité à vérifier'}[q] || q; }
function prioriteInfo(p){
  return {urgente:{label:'Urgente', icon:'🔴', cls:'prio-urgente'}, preventif:{label:'Contrôle préventif', icon:'🟢', cls:'prio-preventif'}}[p]
    || {label:'Normale', icon:'🟠', cls:'prio-normale'};
}
function statutLabel(s){ return {demande_recue:'Demande reçue — AR à établir', inscrit:'Inscrit', radiee:'Radiée'}[s] || s; }

let registreFilter = null;
function renderRegistre(search){
  search = (search||'').toLowerCase();
  const all = appState.entries.filter(e=>e.statut!=='radiee');
  let list = all.filter(e => !search || (e.nom+' '+e.prenom+' '+(e.adresse||'')+' '+(e.tel||'')).toLowerCase().includes(search));
  if(registreFilter==='65plus') list = list.filter(e=>e.qualite==='65plus');
  if(registreFilter==='60inapte') list = list.filter(e=>e.qualite==='60inapte');
  if(registreFilter==='handicap') list = list.filter(e=>e.qualite==='handicap');
  if(registreFilter==='a_verifier') list = list.filter(e=>e.qualite==='a_verifier');
  if(registreFilter==='seul') list = list.filter(e=>e.seul==='oui');
  if(registreFilter==='sansTel') list = list.filter(e=>!e.tel);
  if(registreFilter==='verif') list = list.filter(e=>e.statut==='inscrit' && verifStatus(e).level!=='ok');
  if(registreFilter==='absence') list = list.filter(e=>e.absDebut && e.absFin);
  if(registreFilter==='attente') list = list.filter(e=>e.statut==='demande_recue');
  list = list.sort((a,b)=> a.nom.localeCompare(b.nom));

  const chips = [
    ['attente','Demandes en attente'], ['65plus','65 ans et +'], ['60inapte','60+ inapte'], ['handicap','Handicap'],
    ['a_verifier','⚠️ Qualité à vérifier'],
    ['seul','Vit seul(e)'], ['sansTel','Sans téléphone'], ['verif','Vérif. à faire'], ['absence','Absence prévue'],
  ].map(([k,l]) => `<button class="filter-chip ${registreFilter===k?'active':''}" onclick="setRegistreFilter('${k}')">${l}</button>`).join('');

  let rows = '';
  if(list.length===0){
    rows = `<div class="empty-state"><div class="ic">📋</div><p>${all.length===0 ? "Aucune personne inscrite pour le moment." : "Aucun résultat."}</p></div>`;
  } else {
    rows = list.map(e => {
      const v = e.statut==='inscrit' ? verifStatus(e) : {level:'warn', label:'', icon:'🟠'};
      return `
      <div class="entry-card" onclick="openDetail('${e.id}')">
        <div class="name"><span class="dot ${v.level}" title="${esc(v.label)}"></span>${esc(e.prenom)} ${esc(e.nom)}${e.naissance? ' · '+age(e.naissance)+' ans' : ''}</div>
        <div class="meta">${esc(e.adresse)||'Adresse non renseignée'}${e.tel? ' · '+esc(e.tel) : ''}</div>
        <span class="pill">${qualiteLabel(e.qualite)}</span>
        ${e.seul==='oui' ? '<span class="pill seul">Vit seul(e)</span>' : ''}
        ${e.statut==='demande_recue' ? '<span class="pill statut-demande">AR à établir</span>' : ''}
        ${e.priorite==='urgente' ? '<span class="prio-tag prio-urgente">🔴 Urgente</span>' : ''}
      </div>`;
    }).join('');
  }
  document.getElementById('mainContent').innerHTML = `
    <h2 style="margin-bottom:12px;">Registre (${all.length})</h2>
    <input class="searchbar" placeholder="Nom, prénom, adresse ou téléphone…" oninput="renderRegistre(this.value)" value="${esc(search)}">
    <div class="filters">${chips}</div>
    ${rows}
  `;
}
function setRegistreFilter(k){ registreFilter = registreFilter===k ? null : k; renderRegistre(); }

function openDetail(id){
  const e = appState.entries.find(x=>x.id===id);
  if(!e) return;
  const rows = [
    ['Statut', statutLabel(e.statut)],
    ['Date de naissance', e.naissance || '—'], ['Adresse', e.adresse || '—'], ['Téléphone', e.tel || '—'],
    ['Email', e.email || '—'], ['Qualité', qualiteLabel(e.qualite)],
    ['Prestation / dispositif', {aucun:'Aucun / non renseigné', apa:'APA', pch:'PCH', autre_prestation:'Autre prestation', autre_dispositif:'Autre dispositif'}[e.prestation]||'—'],
    ['Vit seul(e)', e.seul==='oui'?'Oui':(e.seul==='non'?'Non':'—')],
    ['Logement', e.logement || '—'], ['Rafraîchissement', e.clim || '—'],
    ["Contact d'urgence", (e.urgNom||'—') + (e.urgTel? ' · '+e.urgTel : '') + (e.urgLien? ' ('+e.urgLien+')' : '')],
    ['Besoins spécifiques', e.besoinsSpecifiques || '—'],
    ['Observations', e.observations || '—'],
    ['Représentant légal', e.tuteurNom ? `${e.tuteurNom} (${e.tuteurQualite||''})` : '—'],
    ['Date de réception de la demande', e.dateReception || '—'],
    ['Demande faite par', e.demandeur==='tiers' ? `Tiers — ${e.tiersNom||''} (${e.tiersQualite||''})` : (e.demandeur==='representant' ? 'Représentant légal' : 'La personne elle-même')],
    ["Accusé de réception", e.ar && e.ar.etabli ? (e.ar.dateEnvoi ? `Envoyé le ${e.ar.dateEnvoi}` : `Établi le ${e.ar.dateEtabli}, non envoyé`) : 'Non établi'],
    ["Date d'inscription", e.dateInscription || '—'],
  ];
  if(e.statut==='inscrit'){
    const v = verifStatus(e);
    rows.push(['Vérification', `${v.icon} ${v.label}${v.jours!==null? ' ('+v.jours+' j)':''} — prochaine : ${e.prochaineVerification||'—'}`]);
    const pr = prioriteInfo(e.priorite);
    rows.push(['Priorité de visite', `${pr.icon} ${pr.label}`]);
    rows.push(['Localisation', e.location ? '📍 Définie' : 'Non définie']);
  }
  if(e.statut==='radiee' && e.radiation){
    rows.push(['Radiation', `${motifLabel(e.radiation.motif)} — ${e.radiation.date}${e.radiation.commentaire? ' — '+e.radiation.commentaire:''}`]);
  }
  const rowsHtml = rows.map(([k,v])=>`<div class="field-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>${k==='Priorité de visite'?'<p class="hint" style="margin:-4px 0 8px;">Repère opérationnel interne pour organiser les tournées — pas une qualification médicale ou juridique.</p>':''}`).join('');

  let actions = `<button class="btn btn-ghost" onclick="editEntry('${e.id}')">Modifier la fiche</button>`;
  if(e.statut!=='radiee'){
    actions += `<button class="btn btn-ghost" onclick="openAccuseReception('${e.id}')">Accusé de réception</button>`;
  }
  if(e.statut==='inscrit'){
    actions += `<button class="btn btn-ghost" onclick="askVerification('${e.id}')">Vérifier l'absence d'opposition</button>`;
    actions += `<button class="btn btn-ghost" onclick="openLocationModal('${e.id}')">📍 Définir la localisation</button>`;
    if(e.tel) actions += `<a class="btn btn-ghost" href="tel:${esc(e.tel)}">📞 Appeler</a>`;
    actions += `<a class="btn btn-ghost" href="${itineraireUrl(e.adresse)}" target="_blank" rel="noopener">🧭 Itinéraire</a>`;
  }
  if(e.statut!=='radiee'){
    actions += `<button class="btn btn-danger" onclick="openRadiationModal('${e.id}')">Radier du registre</button>`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="sheet">
      <button class="close" onclick="this.closest('.sheet-overlay').remove()">✕</button>
      <h2>${esc(e.prenom)} ${esc(e.nom)}</h2>
      <div style="margin:10px 0 16px;">${rowsHtml}</div>
      ${actions}
    </div>`;
  document.body.appendChild(overlay);
}

  } : x);

  await persist();

  toast('Personne radiée du registre.');

function motifLabel(m){

function openManualPurgeModal(id){

async function confirmManualPurge(id){

  const err = document.getElementById('purgeErr');

  if(!confirm('Dernière confirmation : supprimer définitivement cette fiche ?')) return;
  addLog('suppression_manuelle', {ficheId: id});
  appState.entries = appState.entries.filter(e => e.id !== id);
  await persist();
  document.querySelector('.sheet-overlay')?.remove();
  toast('Fiche supprimée définitivement.');
  renderReglages();
}

/* ===================== MODE ALERTE — CAMPAGNES ===================== */
function getActiveCampagne(){
  return appState.campagnes.find(c => c.id===appState.campagneActiveId && !c.cloturee) || null;
}
async function startCampagne(){
  const motif = document.getElementById('nouvelleCampagneMotif').value.trim();
  if(!motif){ toast('Indiquez un motif pour la campagne.'); return; }
  const c = { id: crypto.randomUUID(), date: todayStr(), motif, cloturee:false, dateCloture:null, resultats:{} };
  appState.campagnes.unshift(c);
  appState.campagneActiveId = c.id;
  addLog('campagne_creee', {motif});
  await persist();
  renderAlerte();
}
async function cancelCampagne(){
  const c = getActiveCampagne();
  if(!c) return;
  if(Object.keys(c.resultats).length > 0){
    toast("Cette campagne contient déjà des résultats enregistrés — utilisez plutôt Clôturer, pour garder une trace."); return;
  }
  if(!confirm(`Annuler la campagne « ${c.motif} » ? Elle sera entièrement supprimée, y compris de l'historique — contrairement à une clôture.`)) return;
  appState.campagnes = appState.campagnes.filter(x=>x.id!==c.id);
  appState.campagneActiveId = null;
  addLog('campagne_annulee', {motif: c.motif});
  await persist();
  toast('Campagne annulée.');
  renderAlerte();
}
async function closeCampagne(){
  if(!confirm("Clôturer cette campagne d'alerte ? Elle restera consultable dans l'historique.")) return;
  const c = getActiveCampagne();
  if(!c) return;
  c.cloturee = true; c.dateCloture = todayStr();
  appState.campagneActiveId = null;
  addLog('campagne_cloturee', {motif: c.motif});
  await persist();
  renderAlerte();
}
function renderAlerte(){
  const campagne = getActiveCampagne();
  const historique = appState.campagnes.filter(c=>c.cloturee);
  let body = '';
  if(!campagne){
    body = `
      <div class="card">
        <h3>Démarrer une nouvelle campagne d'alerte</h3>
        <label>Motif</label>
        <input type="text" id="nouvelleCampagneMotif" placeholder="ex : Alerte canicule">
        <button class="btn btn-primary" onclick="startCampagne()">Démarrer</button>
      </div>`;
  } else {
    const actifs = appState.entries.filter(e=>e.statut==='inscrit');
    const order = {undefined:0, '':0, visite:0, absent:1, a_contacter:2, contacte:3};
    const sorted = [...actifs].sort((a,b)=>{
      const sa = (campagne.resultats[a.id]||{}).statut || '';
      const sb = (campagne.resultats[b.id]||{}).statut || '';
      return (order[sa]??2) - (order[sb]??2);
    });
    const counts = {contacte:0, absent:0, visite:0, aContacter:0};
    actifs.forEach(e=>{
      const s = (campagne.resultats[e.id]||{}).statut;
      if(s==='contacte') counts.contacte++;
      else if(s==='absent') counts.absent++;
      else if(s==='visite') counts.visite++;
      else counts.aContacter++;
    });
    body = `
      <div class="alert-banner">Campagne : <strong>${esc(campagne.motif)}</strong> — démarrée le ${campagne.date}</div>
      <div class="synth-row">
        <div class="synth-chip"><b>${actifs.length}</b><span>inscrits</span></div>
        <div class="synth-chip"><b>${counts.contacte}</b><span>contactés</span></div>
        <div class="synth-chip"><b>${counts.absent}</b><span>sans réponse</span></div>
        <div class="synth-chip"><b>${counts.visite}</b><span>visite néc.</span></div>
      </div>
      <div class="no-print" style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Imprimer</button>
        ${Object.keys(campagne.resultats).length===0 ? `<button class="btn btn-ghost btn-sm" onclick="cancelCampagne()">✕ Annuler la campagne</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="closeCampagne()">✓ Clôturer la campagne</button>
        <button class="btn btn-primary btn-sm" onclick="startTourneeFromCampagne('${campagne.id}')">🗺️ Organiser une tournée</button>
      </div>
      ${sorted.map(e=>{
        const r = campagne.resultats[e.id] || {};
        const cls = r.statut==='contacte'?'statut-contacte':r.statut==='absent'?'statut-absent':r.statut==='visite'?'statut-visite':'';
        return `
        <div class="alert-entry ${cls}">
          <div class="row1">
            <div>
              <div class="name" style="font-weight:700;">${esc(e.prenom)} ${esc(e.nom)} ${e.naissance? '· '+age(e.naissance)+' ans':''}</div>
              <div class="meta" style="font-size:0.82rem; color:var(--ink-soft);">${esc(e.adresse)}</div>
            </div>
            ${e.tel ? `<a class="telbtn" href="tel:${esc(e.tel)}">📞 Appeler</a>` : ''}
          </div>
          <select class="statut-select" onchange="setCampagneStatut('${e.id}', this.value, null, null)">
            <option value="" ${!r.statut?'selected':''}>À contacter</option>
            <option value="contacte" ${r.statut==='contacte'?'selected':''}>Contacté(e) — RAS</option>
            <option value="absent" ${r.statut==='absent'?'selected':''}>Pas de réponse</option>
            <option value="visite" ${r.statut==='visite'?'selected':''}>Visite nécessaire</option>
          </select>
          <button type="button" class="detail-toggle" onclick="toggleOpt('opt-alerte-${e.id}')">Mode de contact / observation</button>
          <div class="optional-body" id="opt-alerte-${e.id}" style="display:none;">
            <select class="mode-select" id="mode-${e.id}">
              <option value="telephone" ${(!r.mode||r.mode==='telephone')?'selected':''}>Téléphone</option>
              <option value="visite" ${r.mode==='visite'?'selected':''}>Visite</option>
              <option value="autre" ${r.mode==='autre'?'selected':''}>Autre</option>
            </select>
            <textarea id="note-${e.id}" placeholder="Observation (facultatif)">${esc(r.note)}</textarea>
            <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="setCampagneStatut('${e.id}', this.closest('.alert-entry').querySelector('.statut-select').value, document.getElementById('mode-${e.id}').value, document.getElementById('note-${e.id}').value)">Enregistrer l'observation</button>
          </div>
        </div>`;
      }).join('')}
    `;
  }
  const histoHtml = historique.length ? `
    <button class="optional-toggle no-print" onclick="toggleOpt('opt-histo-campagnes')"><span>Historique des campagnes (${historique.length})</span><span>＋</span></button>
    <div class="optional-body" id="opt-histo-campagnes" style="display:none;">
      ${historique.map(c=>{
        const vals = Object.values(c.resultats);
        const contacte = vals.filter(v=>v.statut==='contacte').length;
        return `<div class="entry-card" style="cursor:default;">
          <div class="name">${esc(c.motif)}</div>
          <div class="meta">Du ${c.date} au ${c.dateCloture} — ${contacte}/${vals.length||0} contactés</div>
        </div>`;
      }).join('')}
    </div>` : '';
  document.getElementById('mainContent').innerHTML = `<h2 style="margin-bottom:10px;">Mode alerte</h2>${body}${histoHtml}`;
}
async function setCampagneStatut(entryId, statut, mode, note){
  const c = getActiveCampagne();
  if(!c) return;
  const prev = c.resultats[entryId] || {};
  c.resultats[entryId] = {
    statut: statut || null,
    mode: mode || prev.mode || 'telephone',
    note: (note!==null && note!==undefined) ? note : (prev.note||''),
    agent: currentUser, at: nowISO(),
  };
  addLog('statut_alerte', {ficheId:entryId, statut: statut||'a_contacter'});
  await persist();
  renderAlerte();
}

function logLabel(l){

    fermeture:"Fermeture de l'application",
    fiche_creee:'Demande créée', fiche_modifiee:'Fiche modifiée', radiation:'Radiation',
    ar_envoye:"Accusé de réception envoyé", verification:'Vérification quinquennale',
    suppression_auto:'Suppression automatique (ancien mécanisme, retiré)', suppression_manuelle:'Fiche supprimée définitivement (action manuelle)',
    export_csv:'Export .csv', statut_alerte:"Mise à jour d'appel",
    campagne_creee:'Campagne démarrée'+(l.motif?' — '+l.motif:''), campagne_cloturee:'Campagne clôturée'+(l.motif?' — '+l.motif:''),
    campagne_annulee:'Campagne annulée'+(l.motif?' — '+l.motif:''),
    transmission_preparee:'Transmission préfecture préparée',
    config_commune_modifiee:'Paramètres commune modifiés',
    agent_ajoute:'Agent ajouté', agent_supprime:'Agent supprimé',
    agent_desactive:'Agent désactivé', agent_reactive:'Agent réactivé', agent_debloque:'Agent débloqué',
    agent_revoque:'Habilitation révoquée', echec_connexion:'Échec de connexion', tournee_validee:'Tournée validée',
    sauvegarde_testee:'Sauvegarde testée', restauration_echouee:'Restauration échouée', migration_donnees:'Migration des données',
    sauvegarde:'Sauvegarde créée', restauration:'Sauvegarde restaurée', import_excel:'Import Excel',
    tournee_creee:'Tournée créée', tournee_modifiee:'Tournée modifiée', tournee_demarree:'Tournée démarrée',
    sous_tournee_cloturee:'Sous-tournée terminée',
    visite_realisee:'Visite enregistrée', visite_modifiee:'Résultat de visite modifié', tournee_cloturee:'Tournée clôturée',
    localisation_definie:'Localisation définie'};
  let base = map[l.event]||l.event;
  if(l.ficheId) base += ' · fiche ' + l.ficheId.slice(0,8);
  return base + ' · ' + (l.user||'?');
}

/* ---- Navigateur du journal de traçabilité (filtres + pagination — l'affichage était limité, pas la conservation) ---- */
let journalFilter = { periode:'all', user:'', type:'', search:'', page:0 };
const JOURNAL_PAGE_SIZE = 25;
function setJournalFilter(field, value){ journalFilter[field] = value; journalFilter.page = 0; renderReglages(); }
function changeJournalPage(delta){ journalFilter.page = Math.max(0, journalFilter.page + delta); renderReglages(); }
function renderJournalCard(){
  const all = appState.logs || [];
  const periodDays = { '7':7, '30':30, '90':90 }[journalFilter.periode];
  let list = all;
  if(periodDays) list = list.filter(l => daysBetween(l.at, nowISO()) <= periodDays);
  if(journalFilter.user) list = list.filter(l => l.user === journalFilter.user);
  if(journalFilter.type) list = list.filter(l => l.event === journalFilter.type);
  if(journalFilter.search){
    const s = journalFilter.search.toLowerCase();
    list = list.filter(l => logLabel(l).toLowerCase().includes(s) || (l.ficheId||'').toLowerCase().includes(s));
  }

  const users = [...new Set(all.map(l=>l.user).filter(Boolean))].sort();
  const types = [...new Set(all.map(l=>l.event))].sort();

  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / JOURNAL_PAGE_SIZE));
  journalFilter.page = Math.min(journalFilter.page, totalPages-1);
  const pageStart = journalFilter.page * JOURNAL_PAGE_SIZE;
  const pageItems = list.slice(pageStart, pageStart + JOURNAL_PAGE_SIZE);

  const rowsHtml = pageItems.map(l => `
    <div class="log-row">
      <span class="ev-${l.event==='login'?'login':l.event==='logout'?'logout':'other'}">${esc(logLabel(l))}</span>
      <span>${fmtDT(l.at)}</span>
    </div>`).join('') || '<p class="hint">Aucun événement ne correspond à ces filtres.</p>';

  return `
    <input class="searchbar" placeholder="Rechercher dans le journal…" value="${esc(journalFilter.search)}"
      oninput="setJournalFilter('search', this.value)">
    <div class="grid2">
      <div>
        <label>Période</label>
        <select onchange="setJournalFilter('periode', this.value)">
          <option value="7" ${journalFilter.periode==='7'?'selected':''}>7 derniers jours</option>
          <option value="30" ${journalFilter.periode==='30'?'selected':''}>30 derniers jours</option>
          <option value="90" ${journalFilter.periode==='90'?'selected':''}>90 derniers jours</option>
          <option value="all" ${journalFilter.periode==='all'?'selected':''}>Tout (jusqu'à 1 an)</option>
        </select>
      </div>
      <div>
        <label>Utilisateur</label>
        <select onchange="setJournalFilter('user', this.value)">
          <option value="">Tous</option>
          ${users.map(u=>`<option value="${esc(u)}" ${journalFilter.user===u?'selected':''}>${esc(u)}</option>`).join('')}
        </select>
      </div>
    </div>
    <label>Type d'action</label>
    <select onchange="setJournalFilter('type', this.value)">
      <option value="">Tous les types</option>
      ${types.map(t=>`<option value="${esc(t)}" ${journalFilter.type===t?'selected':''}>${esc(logLabel({event:t}).split(' · ')[0])}</option>`).join('')}
    </select>
    <p class="hint" style="margin-top:10px;">${total} événement(s) — page ${journalFilter.page+1}/${totalPages}</p>
    ${rowsHtml}
    <div class="big-action-row no-print">
      <button class="btn btn-ghost" onclick="changeJournalPage(-1)" ${journalFilter.page<=0?'disabled':''}>← Précédent</button>
      <button class="btn btn-ghost" onclick="changeJournalPage(1)" ${journalFilter.page>=totalPages-1?'disabled':''}>Suivant →</button>
    </div>`;
}

async function addUser(){
  if(!isAdmin()) return;
  const err = document.getElementById('userErr');
  const nomComplet = document.getElementById('newUser2Nom').value.trim();
  const fonction = document.getElementById('newUser2Fonction').value.trim();
  const username = document.getElementById('newUser2').value.trim();
  const role = document.getElementById('newUserRole').value;
  const p1 = document.getElementById('newUser2Pass').value;
  const p2 = document.getElementById('newUser2Pass2').value;
  if(!username || !nomComplet){ err.textContent = "Merci d'indiquer le nom complet et l'identifiant."; return; }
  if(getUsers().some(u=>u.username===username)){ err.textContent = 'Cet identifiant existe déjà.'; return; }
  if(p1.length < 12){ err.textContent = 'Le mot de passe doit contenir au moins 12 caractères.'; return; }
  if(p1 !== p2){ err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
  if(role==='admin'){
    if(!document.getElementById('confirmAdminGrant').checked){ err.textContent = "Merci de confirmer explicitement l'octroi des droits d'administrateur."; return; }
    if(!confirm(`Confirmer la création d'un compte ADMINISTRATEUR pour ${nomComplet} ?`)) return;
  }
  const rawDEK = await crypto.subtle.exportKey('raw', dekKey);
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const kek = await deriveKEK(p1, salt);
  const wrappedDEK = await aesEncryptBytes(kek, new Uint8Array(rawDEK));
  const users = getUsers();
  users.push({ id: crypto.randomUUID(), username, nomComplet, fonction, salt, wrappedDEK, role, actif:true,
    dateHabilitation: todayStr(), habilitePar: currentUser, dateDebut: todayStr(), dateFin:null });
  saveUsers(users);
  addLog('agent_ajoute', {agentCree: username});
  await persist();
  toast('Compte créé pour ' + nomComplet + '.');
  renderReglages();
}

async function verifyOwnBackup(payload){
  // Vérifie que le contenu tout juste chiffré se déchiffre correctement (intégrité), sans rien modifier.
  try{
    const decoded = await decryptJSON(dekKey, payload.data);
    return { ok:true, nbPersonnes: (decoded.entries||[]).filter(e=>e.statut!=='radiee').length };
  }catch(e){ return { ok:false }; }
}

}

async function confirmRestore(payload){
  const err = document.getElementById('restoreErr');
  const username = document.getElementById('restoreUser').value;
  const password = document.getElementById('restorePass').value;
  const user = payload.users.find(u=>u.username===username);
  let decoded, key;
  try{
    const kek = await deriveKEK(password, user.salt);
    const rawDEK = await aesDecryptBytes(kek, user.wrappedDEK);
    key = await crypto.subtle.importKey('raw', rawDEK, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
    decoded = await decryptJSON(key, payload.data); // vérifie l'intégrité avant tout remplacement
  }catch(e){
    err.textContent = "Échec du déchiffrement — mot de passe incorrect ou fichier corrompu. Restauration annulée.";
    addLog('restauration_echouee', {motif:'dechiffrement'});
    await persist();
    return;
  }
  if(!decoded || !Array.isArray(decoded.entries)){
    err.textContent = "Le contenu déchiffré ne correspond pas à un registre valide. Restauration annulée.";
    addLog('restauration_echouee', {motif:'structure'});
    await persist();
    return;
  }
  if(!confirm(`Dernière confirmation : remplacer définitivement les données actuelles (${appState.entries.filter(e=>e.statut!=='radiee').length} fiche(s)) par cette sauvegarde (${decoded.entries.length} personne(s)) ?`)) return;

  // Sauvegarde de sécurité systématique et non désactivable avant tout remplacement des données.
  const nbPersonnes = appState.entries.filter(e=>e.statut!=='radiee').length;
  const safetyPayload = { type:'pv-backup', version:2, appVersion: APP_VERSION, exportedAt: nowISO(), nbPersonnes,
    users: getUsers(), data: localStorage.getItem(LS_DATA) };
  const verif = await verifyOwnBackup(safetyPayload);
  const safetyBackupOk = verif.ok;
  const blob = new Blob([JSON.stringify(safetyPayload)], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `registre-avant-restauration-${todayStr()}.pvbackup`;
  a.click();
  if(!verif.ok){
    err.textContent = "La sauvegarde de sécurité automatique n'a pas pu être vérifiée — restauration interrompue par prudence. Réessayez.";
    return;
  }
  // Les événements de sauvegarde de sécurité et de restauration sont inscrits dans le journal DE LA SAUVEGARDE
  // RESTAURÉE (ré-encodé avec sa propre clé), puisque le journal de la session actuelle sera de toute façon
  // remplacé par cette opération.
  decoded.logs = decoded.logs || [];
  decoded.logs.unshift({ event:'sauvegarde', user: currentUser, at: nowISO(), verifiee: safetyBackupOk, note:'sauvegarde de sécurité avant restauration' });
  decoded.logs.unshift({ event:'restauration', user: currentUser, at: nowISO(), nb: decoded.entries.length });
  const reencoded = await encryptJSON(key, decoded);
  localStorage.setItem(LS_USERS, JSON.stringify(payload.users));
  localStorage.setItem(LS_DATA, reencoded);
  document.querySelector('.sheet-overlay')?.remove();
  toast('Sauvegarde restaurée. Veuillez vous reconnecter.');
  // dekKey est invalidée AVANT lockApp() : sinon lockApp persisterait l'ancien appState encore en mémoire
  // par-dessus les données qu'on vient tout juste de restaurer, annulant silencieusement la restauration.
  dekKey = null;
  await lockApp('manuel');
}
